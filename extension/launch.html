<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="launchPageTitle"></title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="card">
    <h1 id="title" data-i18n="launchOpeningGeneric"></h1>
    <p id="file" class="file" hidden></p>
    <p id="message" class="muted" data-i18n="launchDialogHint"></p>

    <div id="actions" class="actions" hidden>
      <button id="open-edit" type="button" class="primary" data-i18n="btnOpenDesktop"></button>
      <button id="open-view" type="button" data-i18n="btnOpenView"></button>
      <button id="open-browser" type="button" data-i18n="btnOpenBrowser"></button>
      <button id="copy" type="button" data-i18n="btnCopy"></button>
    </div>

    <details id="details" hidden>
      <summary data-i18n="details"></summary>
      <dl>
        <dt data-i18n="detailsSource"></dt><dd id="src" class="mono"></dd>
        <dt data-i18n="detailsFileUrl"></dt><dd id="file-url" class="mono"></dd>
      </dl>
    </details>

    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="launch.js"></script>
</body>
</html>
