<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office アプリで開いています</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="card">
    <h1 id="title">Office アプリで開いています…</h1>
    <p id="file" class="file" hidden></p>
    <p id="message" class="muted">
      ブラウザに「アプリを開きますか？」と表示された場合は「開く」を選んでください。
    </p>

    <div id="actions" class="actions" hidden>
      <button id="open-edit" type="button" class="primary">デスクトップアプリで開く</button>
      <button id="open-view" type="button">読み取り専用で開く</button>
      <button id="open-browser" type="button">ブラウザで開く</button>
      <button id="copy" type="button">ファイル URL をコピー</button>
    </div>

    <details id="details" hidden>
      <summary>詳細</summary>
      <dl>
        <dt>元のリンク</dt><dd id="src" class="mono"></dd>
        <dt>ファイル URL</dt><dd id="file-url" class="mono"></dd>
      </dl>
    </details>

    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="launch.js"></script>
</body>
</html>
