<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optPageTitle"></title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="card">
    <h1 data-i18n="optPageTitle"></h1>
    <p id="managed" class="note" hidden data-i18n="optManaged"></p>

    <label class="row"><input type="checkbox" id="enabled"> <span data-i18n="optEnabled"></span></label>

    <h2 data-i18n="optHostsHeading"></h2>
    <textarea id="allowedHosts" spellcheck="false" placeholder="contoso&#10;contoso-my.sharepoint.com"></textarea>
    <p class="note"><span data-i18n="optHostsNote1"></span><code>contoso.sharepoint.com</code><span data-i18n="optHostsNote2"></span><code>contoso-my.sharepoint.com</code><span data-i18n="optHostsNote3"></span></p>

    <h2 data-i18n="optOpenModeHeading"></h2>
    <select id="openMode">
      <option value="ofe" data-i18n="optModeEdit"></option>
      <option value="ofv" data-i18n="optModeView"></option>
    </select>

    <label class="row"><input type="checkbox" id="autoLaunch"> <span data-i18n="optAutoLaunch"></span></label>
    <label class="row"><input type="checkbox" id="closeTabAfterLaunch"> <span data-i18n="optCloseTab"></span></label>
    <p class="note" data-i18n="optCloseTabNote"></p>

    <div class="actions">
      <button id="save" type="button" class="primary" data-i18n="optSave"></button>
    </div>
    <p id="status" class="status note"></p>

    <h2 data-i18n="optExtIdHeading"></h2>
    <p class="mono" id="ext-origin"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
